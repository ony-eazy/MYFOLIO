{# shared topbar for logged-in pages — each page pulls this in with an include tag #}
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/dashboard">
      <svg class="logo-mark" viewBox="0 0 48 48" aria-label="Showcase logo">
        <polygon points="24,8 40,26 8,26" fill="#E0A86B"></polygon>
        <polygon points="24,44 40,26 8,26" fill="#E0A86B" opacity="0.3"></polygon>
      </svg>
      <span>Myfolio</span>
    </a>

    <!-- ☰ only shows on phones; tapping it opens/closes the nav -->
    <button type="button" id="menuToggle" aria-label="Open menu" aria-expanded="false"
            aria-controls="mainNav">☰</button>

    <nav id="mainNav">
      <!-- request.path is the current page's address, so the matching link gets class="active" -->
      <a href="/dashboard" class="{{ 'active' if request.path == '/dashboard' }}">Dashboard</a>
      <a href="/profile" class="{{ 'active' if request.path == '/profile' }}">Edit Profile</a>
      <a href="/projects" class="{{ 'active' if request.path == '/projects' }}">Projects</a>
      <a href="/testimonials" class="{{ 'active' if request.path == '/testimonials' }}">Testimonials
        {%- if pending_count %} <span class="nav-badge" title="Waiting for your review">{{ pending_count }}</span>{% endif %}</a>
      <a href="/u/{{ session['username'] }}" target="_blank">View portfolio</a>
      <a href="/logout" id="navLogout">Log Out</a>
      <button type="button" id="themeToggler">🌞</button>
    </nav>
  </div>
</header>

<script>
  // phone menu: add/remove the "open" class on the nav when ☰ is tapped
  const menuToggle = document.querySelector('#menuToggle');
  const mainNav = document.querySelector('#mainNav');

  menuToggle.addEventListener('click', function () {
    const isOpen = mainNav.classList.toggle('open');
    menuToggle.textContent = isOpen ? '✕' : '☰';
    menuToggle.setAttribute('aria-expanded', isOpen);
  });
</script>
