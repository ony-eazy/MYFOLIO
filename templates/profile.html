<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

        <!-- dashboard_style.css = shared palette/layout, profile_style.css = form styles -->
        <link rel="stylesheet" href="{{ url_for('static', filename='dashboard_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='profile_style.css') }}">
  </head>

  <body>
    {% include "_topbar.html" %}

    <main class="profile-card">
      <h1>My Profile</h1>

      <!-- "Profile updated!" or an error, after clicking Save -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
          <p class="flash {{ category }}">{{ msg }}</p>
        {% endfor %}
      {% endwith %}


      <form action="/profile" method="post">

        <!-- locked: shown for reference only -->
        <label for="username">Username</label>
        <input type="text" id="username" value="{{ user.Username }}" disabled>

        <label for="email">Email</label>
        <input type="email" id="email" value="{{ user.Email }}" disabled>

        <!-- editable fields -->
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name"
               value="{{ user.Full_name or '' }}" maxlength="45" required>

        <label for="role_headline">Headline</label>
        <input type="text" id="role_headline" name="role_headline"
               value="{{ user.Role_headline or '' }}" maxlength="150"
               placeholder="e.g. Frontend Developer & UI Designer">

        <label for="bio">Bio</label>
        <textarea id="bio" name="bio" rows="5"
        maxlength="1000"
                  placeholder="Tell visitors a little about yourself">{{ user.Bio or '' }}</textarea>

        <label for="skills">Skills</label>
        <input type="text" id="skills" name="skills"
               value="{{ user.Skills or '' }}" maxlength="255"
               placeholder="e.g. HTML, CSS, Python, Figma">
                       <!-- social links -->
        <h2 class="form-section-title">Social links</h2>

        <label for="github_url">GitHub <span class="optional">(optional)</span></label>
        <input type="text" inputmode="url" id="github_url" name="github_url"
               value="{{ user.Github_url or '' }}" maxlength="255"
               placeholder="github.com/your-username">

        <label for="linkedin_url">LinkedIn <span class="optional">(optional)</span></label>
        <input type="text" inputmode="url" id="linkedin_url" name="linkedin_url"
               value="{{ user.Linkedin_url or '' }}" maxlength="255"
               placeholder="linkedin.com/in/your-name">

        <label for="discord_username">Discord username <span class="optional">(optional)</span></label>
        <input type="text" id="discord_username" name="discord_username"
               value="{{ user.Discord_username or '' }}" maxlength="32"
               pattern="@?[A-Za-z0-9_.]{2,32}"
               title="2–32 characters: letters, numbers, _ and ."
               placeholder="your_username">


        <button type="submit" id="saveBtn">Save changes</button>
      </form>

      <!-- outside the form, so clicking it never submits it -->
      <button type="button" id="publishBtn">Publish profile</button>
    </main>
        <script src="/static/theme.js"></script>
  </body>
</html>
