<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

        <!-- dashboard_style.css = shared palette/layout, profile_style.css = form styles -->
        <link rel="stylesheet" href="{{ url_for('static', filename='dashboard_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='profile_style.css') }}">
  </head>

  <body>
        <header class="topbar">
      <button type="button" id="themeToggler">🌞</button>
      <div class="wrap topbar-inner">
            <a class="brand" href="/dashboard">
                <svg class="logo-mark" viewBox="0 0 48 48" aria-label="Showcase logo">
                    <polygon points="24,8 40,26 8,26" fill="#E0A86B"></polygon>
                    <polygon points="24,44 40,26 8,26" fill="#E0A86B" opacity="0.3"></polygon>
                </svg>
                <span>Myfolio</span>
            </a>
        </div>
    </header>

    <main class="profile-card">
      <h1>My Profile</h1>

      <form action="/profile" method="post">

        <!-- locked: shown for reference only -->
        <label for="username">Username</label>
        <input type="text" id="username" value="{{ user.Username }}" disabled>

        <label for="email">Email</label>
        <input type="email" id="email" value="{{ user.Email }}" disabled>

        <!-- editable fields -->
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name"
               value="{{ user.Full_name or '' }}" maxlength="45" required>

        <label for="role_headline">Headline</label>
        <input type="text" id="role_headline" name="role_headline"
               value="{{ user.Role_headline or '' }}" maxlength="150"
               placeholder="e.g. Frontend Developer & UI Designer">

        <label for="bio">Bio</label>
        <textarea id="bio" name="bio" rows="5"
                  placeholder="Tell visitors a little about yourself">{{ user.Bio or '' }}</textarea>

        <label for="skills">Skills</label>
        <input type="text" id="skills" name="skills"
               value="{{ user.Skills or '' }}" maxlength="255"
               placeholder="e.g. HTML, CSS, Python, Figma">

        <button type="submit" id="saveBtn">Save changes</button>
      </form>

      <!-- outside the form, so clicking these never submits it -->
      <button type="button" id="publishBtn">Publish profile</button>
      <button type="button" id="logoutBtn" onclick="window.location.href='/logout'">Log Out</button>
    </main>
        <script src="/static/theme.js"></script>
  </body>
</html>
