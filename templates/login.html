<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='login_style.css') }}">
    <title>Login</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    
  </head>
  <body>
    <header class="topbar">
      <button type="button" id="themeToggler">🌞</button>
      <div class="wrap topbar-inner">
            <a class="brand" href="#">
                <!-- LOGO SYMBOL: a peak with a faded reflection (inline SVG) -->
                <svg class="logo-mark" viewBox="0 0 48 48" aria-label="Showcase logo">
                    <polygon points="24,8 40,26 8,26" fill="#E0A86B"></polygon>
                    <polygon points="24,44 40,26 8,26" fill="#E0A86B" opacity="0.3"></polygon>
                </svg>
            
                <span>Myfolio</span>
                
            </a>
        </div>  
    </header>
        <h1>Login</h1>
        <form action="/login" method="post">
          {% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for msg in messages %}
      <p class="error-msg">{{ msg }}</p>
    {% endfor %}
  {% endif %}
{% endwith %}
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>

            <input type="submit" value="Continue">
    <p>Have not created an account yet ?</p>    
    <button id="signupLink" type="button" onclick="window.location.href='/signup'">Sign Up</button>
    

  
      <script src="/static/theme.js"></script>

  </body>
</html>
